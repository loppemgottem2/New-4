<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <title>Lion AI</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <button class="icon-btn" id="newChat" aria-label="New chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="modelTab" aria-expanded="false" aria-controls="models">
        <span class="brand"><img src="icon.svg" alt=""><span>Lion AI</span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>
        <span id="modelLine">Tap to see models</span>
      </button>
      <button class="icon-btn" id="openSettings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <div class="stage">
    <main id="chat">
      <div id="empty">
        <img src="icon.svg" alt="">
        <h1>How can I help?</h1>
        <div class="suggest">
          <button data-p="Explain how transformers work, simply">Explain transformers</button>
          <button data-p="Write a Python function to merge two sorted lists">Write code</button>
          <button data-p="Plan a 3-day trip to Tokyo on a budget">Plan a trip</button>
        </div>
      </div>
    </main>
    <section id="models" hidden aria-label="Models">
      <div id="plan"></div>
      <div class="mhead">
        <h3>All models <span id="mCount"></span></h3>
        <div id="mTools"></div>
        <input id="mSearch" type="search" placeholder="Search models or companies">
      </div>
      <div id="mList"></div>
    </section>
    </div>

    <footer>
      <div class="controls">
        <div class="seg" id="mode">
          <button data-v="auto" class="on">Auto</button>
          <button data-v="compare">Compare</button>
          <button data-v="council">Council</button>
        </div>
        <div class="seg" id="effort">
          <button data-v="low">Low</button>
          <button data-v="medium" class="on">Med</button>
          <button data-v="high">High</button>
        </div>
        <button class="chip" id="research" aria-pressed="false">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Research
        </button>
      </div>
      <form id="composer">
        <textarea id="input" rows="1" placeholder="Message Lion AI" enterkeyhint="send"></textarea>
        <button id="send" type="submit" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
    </footer>
  </div>

  <div id="sheet" hidden>
    <div class="sheet-card">
      <div class="sheet-head"><h2>Settings</h2><button class="icon-btn" id="closeSettings" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <label>Provider
        <select id="provider">
          <option value="https://openrouter.ai/api/v1">OpenRouter (free models)</option>
          <option value="http://localhost:11434/v1">Ollama (local)</option>
          <option value="custom">Custom OpenAI-compatible</option>
        </select>
      </label>
      <label id="customWrap" hidden>Base URL <input id="baseUrl" placeholder="https://…/v1"></label>
      <label>API key <input id="apiKey" type="password" placeholder="sk-or-…" autocomplete="off"></label>
      <p class="hint">Free key at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>. Stored only on this device.</p>
      <label class="row"><input type="checkbox" id="freeOnly" checked> Free models only</label>
      <button class="primary" id="loadModels">Load models</button>
      <p class="hint" id="modelStatus"></p>
      <p class="hint">Version 2.0</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
